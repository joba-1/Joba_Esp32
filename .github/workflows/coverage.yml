name: Coverage

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcovr build-essential python3-pip
          pip3 install --upgrade pip
          pip3 install platformio

      - name: Run native tests and coverage
        env:
          PIO_NONINTERACTIVE: 1
        run: |
          pio run -e native -t clean
          platformio test --environment native
          bash misc/coverage/run_coverage.sh

      - name: Upload coverage html
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html

      - name: Upload lcov info
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage/coverage.info.filtered

      - name: Send to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage.info.filtered
